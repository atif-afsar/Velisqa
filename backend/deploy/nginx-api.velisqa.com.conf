# /etc/nginx/sites-available/velisqa-api  (enable with a symlink in sites-enabled)
# Issue the certificate FIRST with a plain :80 server block + `certbot --nginx -d api.velisqa.com`,
# then install this file. Node listens on 127.0.0.1:5001 only; MongoDB is never exposed.

limit_req_zone $binary_remote_addr zone=velisqa_api:10m rate=20r/s;

# http-level: do not log query strings (legacy private order links carry ?token=...).
log_format velisqa_api '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time "$http_user_agent" rid=$request_id';

server {
    listen 80;
    listen [::]:80;
    server_name api.velisqa.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.velisqa.com;

    ssl_certificate     /etc/letsencrypt/live/api.velisqa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.velisqa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 2m;           # JSON only; images go straight to Cloudinary

    # The catalogue list is ~50-100 KB of JSON; gzip shrinks it ~85%. Not applied to the SSE stream (text/event-stream is excluded).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json;
    proxy_read_timeout 65s;
    proxy_connect_timeout 10s;

    access_log /var/log/nginx/velisqa-api.access.log velisqa_api;

    location /api/ {
        limit_req zone=velisqa_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }

    # Provider webhooks: body must reach Express byte-for-byte (HMAC over the raw body).
    location /api/v1/webhooks/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Admin new-order stream (Server-Sent Events): no buffering, long-lived.
    location = /api/v1/admin/events {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /health { proxy_pass http://127.0.0.1:5001; access_log off; }

    location / { return 404; }
}
