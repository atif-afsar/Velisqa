# /etc/mongod.conf — single-node replica set on the VPS (transactions need a replica set).
# Bound to loopback only; port 27017 must stay closed in UFW and the Hostinger firewall.
storage:
  dbPath: /var/lib/mongodb
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
net:
  port: 27017
  bindIp: 127.0.0.1
security:
  authorization: enabled
  keyFile: /etc/mongodb/keyfile      # openssl rand -base64 756 > keyfile; chmod 400; chown mongodb
replication:
  replSetName: rs0
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
