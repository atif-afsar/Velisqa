# SAMPLE FINAL TLS vhost. Replace domain/path. Obtain certificates first via
# temporary HTTP vhost + certbot before enabling ssl_certificate directives.
server {
    listen 80;
    server_name api.velisqa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.velisqa.com;
    ssl_certificate /etc/letsencrypt/live/api.velisqa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.velisqa.com/privkey.pem;

    client_max_body_size 12m;
    proxy_read_timeout 65s;
    proxy_connect_timeout 15s;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }

    # Optional: if SSE implemented, match actual route and disable buffering
    location = /api/v1/admin/events {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}
